name: Publicar Merenda Jardim Cumbica II
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}
