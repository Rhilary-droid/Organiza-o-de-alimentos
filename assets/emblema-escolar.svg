<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">Coruja cozinheira da Cantina Escolar Jardim Cumbica II</title>
<desc id="desc">Mascote de coruja branca e azul, com olhos azuis brilhantes, asas abertas e chapéu branco de cozinheira.</desc>
<defs>
 <linearGradient id="feather" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#f4f8ff"/><stop offset="1" stop-color="#b9cce8"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168bff"/><stop offset=".5" stop-color="#0752b9"/><stop offset="1" stop-color="#061b50"/></linearGradient>
 <radialGradient id="iris"><stop stop-color="#bcecff"/><stop offset=".34" stop-color="#36aaff"/><stop offset=".72" stop-color="#0860c9"/><stop offset="1" stop-color="#061a46"/></radialGradient>
 <linearGradient id="toque" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#d9e7fb"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<ellipse cx="360" cy="488" rx="205" ry="18" fill="#001437" opacity=".24" filter="url(#shadow)"/>
