<circle cx="270" cy="515" r="112" fill="url(#blue)" stroke="#0b3f89" stroke-width="12"/>
<circle cx="430" cy="515" r="112" fill="url(#blue)" stroke="#0b3f89" stroke-width="12"/>
<circle cx="270" cy="515" r="82" fill="#fff"/>
<circle cx="430" cy="515" r="82" fill="#fff"/>
<circle cx="270" cy="515" r="46" fill="#0b2b5f"/>
<circle cx="430" cy="515" r="46" fill="#0b2b5f"/>
<circle cx="252" cy="492" r="15" fill="#fff"/><circle cx="412" cy="492" r="15" fill="#fff"/>
<!-- beak -->
<path d="M350 615 310 660 350 695 390 660Z" fill="#0b3f89" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
</svg>