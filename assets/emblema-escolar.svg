<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="title desc">
<title id="title">Emblema E.E. PEI Jardim Nova Cumbica II</title>
<desc id="desc">Logo uniforme: nome da escola em arco, coruja geométrica com olhos grandes e capelo escolar, em azul, branco e azul-marinho.</desc>
<defs>
 <path id="schoolArc" d="M105 390 A250 250 0 0 1 595 390"/>
 <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1677e8"/><stop offset="1" stop-color="#073575"/></linearGradient>
</defs>
<!-- lettering follows the original reference arc -->
<text fill="#fff" stroke="#0a2c64" stroke-width="3" paint-order="stroke" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="48" letter-spacing="-1">
 <textPath href="#schoolArc" startOffset="50%" text-anchor="middle">E.E. PEI JARDIM NOVA CUMBICA II</textPath>
</text>
<!-- Graduation cap -->
<path d="M190 290 350 235 510 290 350 345Z" fill="#fff" stroke="#0b3f89" stroke-width="13" stroke-linejoin="round"/>
<path d="M245 323 350 360 455 323 455 385Q350 420 245 385Z" fill="url(#blue)" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
<!-- owl brow / silhouette -->
<path d="M135 350Q215 460 275 420Q350 395 425 420Q485 460 565 350Q535 455 490 500Q530 565 470 620Q405 665 350 610Q295 665 230 620Q170 565 210 500Q165 455 135 350Z" fill="#fff" stroke="#0b3f89" stroke-width="15" stroke-linejoin="round"/>
